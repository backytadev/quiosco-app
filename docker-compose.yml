services:
  postgres-db:
    image: postgres:16.7
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres-db:/var/lib/postgresql/data
    ports:
      - 5435:5432

  pgAdmin:
    depends_on:
      - postgres-db
    image: dpage/pgadmin4:8.14.0
    ports:
      - 8081:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
